<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小箱子</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { light: '#A855F7', DEFAULT: '#9333EA', dark: '#7C3AED' },
                        secondary: { light: '#C084FC', DEFAULT: '#A855F7', dark: '#9333EA' }
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
            .hover-lift { transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
            .hover-lift:hover {
                transform: translateY(-5px) scale(1.05);
                box-shadow: 0 16px 20px -5px rgba(0,0,0,0.08), 0 8px 8px -5px rgba(0,0,0,0.032);
                background: #fff;
                border-color: rgba(168,85,247,0.15);
            }
            .dark .hover-lift:hover {
                box-shadow: 0 16px 30px -5px rgba(168,85,247,0.3), 0 8px 15px -5px rgba(168,85,247,0.2);
                background: rgba(30,30,40,0.8);
                border-color: rgba(168,85,247,0.35);
            }
        }

        body {
            overflow-x: hidden;
            background: linear-gradient(to top, rgba(168,85,247,0.15), #fff 70%);
            transition: background 0.4s ease;
            position: relative;
        }

        body.dark {
            background: #0f0f17;
        }
        body.dark::before {
            content: '';
            position: fixed; inset: 0;
            pointer-events: none; z-index: -1;
            box-shadow: inset 0 0 180px 45px rgba(168,85,247,0.28);
            animation: borderBreath 3.2s ease-in-out infinite alternate;
        }

        @keyframes borderBreath {
            from { box-shadow: inset 0 0 140px 35px rgba(168,85,247,0.22); }
            to   { box-shadow: inset 0 0 220px 60px rgba(168,85,247,0.35); }
        }

        /* 退场背景覆盖：浅色模式用白色，深色模式用黑色 */
        body.exit-bg {
            transition: background 0s; /* 立即生效，无过渡 */
        }
        body.exit-bg:not(.dark) {
            background: white !important;
        }
        body.exit-bg.dark {
            background: #000000 !important; /* 纯黑，或 #0a0a0f 也可 */
        }
        body.exit-bg::before {
            display: none !important; /* 移除深色模式的光晕特效 */
        }

        @keyframes dropDown {
            from { opacity: 0; transform: translateY(-140px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-drop {
            animation: dropDown 1s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease forwards; opacity: 0; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }

        .nav-option {
            padding: 1rem 2.5rem; font-size: 1.5rem; font-weight: 500; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
            background: transparent; border-radius: 12px;
            border: 1px solid rgba(168,85,247,0.1);
            color: #374151;
        }
        .dark .nav-option {
            border-color: rgba(168,85,247,0.25);
            color: #e5e7eb;
        }

        .theme-toggle {
            position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
            width: 44px; height: 44px; border-radius: 12px;
            border: 1px solid rgba(168,85,247,0.15);
            background: transparent;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: #6b7280;
            transition: all 0.35s ease; z-index: 999;
        }
        .theme-toggle:hover {
            transform: translateX(-50%) translateY(-2px);
            background: #fff; border-color: rgba(168,85,247,0.2);
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        }
        .dark .theme-toggle {
            border-color: rgba(168,85,247,0.3);
            color: #d1d5db;
        }
        .dark .theme-toggle:hover {
            background: rgba(32,32,46,0.8);
            box-shadow: 0 8px 22px rgba(168,85,247,0.22);
        }

        .title-gradient {
            background: linear-gradient(90deg, #A855F7, #EC4899);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .dark .title-gradient {
            background: linear-gradient(90deg, #C084FC, #F472B6);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-exit { animation: pageExit 0.8s cubic-bezier(0.25,0.46,0.45,0.94) forwards; }
        .nav-exit { animation: navExit 0.6s ease forwards; }
        @keyframes pageExit { to { opacity: 0; } }
        @keyframes navExit { to { opacity: 0; transform: translateY(30px) scale(0.95); } }
                /* 星星样式 */
        .star {
            position: fixed;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: twinkle 3s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>

<body class="font-sans min-h-screen flex flex-col">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark');
            }
        })();
    </script>
    <button id="themeToggle" class="theme-toggle">
        <i class="fa fa-moon-o"></i>
    </button>

    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12">
        <h1 id="pageTitle" class="text-[clamp(2.5rem,8vw,5rem)] font-bold mb-16 text-center animate-drop">
            <span class="title-gradient">小箱子</span>
        </h1>

        <div id="navContainer" class="flex flex-col md:flex-row gap-8 md:gap-16">
            <a href="index1.html" class="nav-option animate-fade-in-up delay-200 hover-lift nav-link">
                <i class="fa fa-flask mr-2"></i>成分
            </a>
            <a href="tool.html" class="nav-option animate-fade-in-up delay-300 hover-lift nav-link">
                <i class="fa fa-wrench mr-2"></i>工具
            </a>
        </div>
    </main>

    <script>
        // 深色模式初始化
        function initTheme() {
            const btn = document.getElementById('themeToggle');
            const icon = btn.querySelector('i');
            const saved = localStorage.getItem('theme');

            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme:dark)').matches)) {
                document.body.classList.add('dark');
                icon.classList.replace('fa-moon-o', 'fa-sun-o');
            }

            btn.onclick = () => {
                const isDark = document.body.classList.toggle('dark');
                icon.classList.toggle('fa-moon-o', !isDark);
                icon.classList.toggle('fa-sun-o', isDark);
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            };
        }

        let isExiting = false;

        function pageExitAnimation(url) {
            if (isExiting) return;
            isExiting = true;

            const body = document.body;
            const title = document.getElementById('pageTitle');
            const nav = document.getElementById('navContainer');

            // 添加退场动画类（内容渐隐）
            body.classList.add('page-exit');
            title.classList.add('nav-exit');
            nav.classList.add('nav-exit');

            // 根据当前深色模式添加对应的背景覆盖类
            body.classList.add('exit-bg');

            // 禁用导航链接
            document.querySelectorAll('.nav-link').forEach(link => {
                link.style.pointerEvents = 'none';
            });

            setTimeout(() => {
                window.location.href = url;
            }, 800);
        }

        function resetPageState() {
            const body = document.body;
            const title = document.getElementById('pageTitle');
            const nav = document.getElementById('navContainer');
            const links = document.querySelectorAll('.nav-link');

            // 移除所有退场相关类
            body.classList.remove('page-exit', 'exit-bg');
            title.classList.remove('nav-exit');
            nav.classList.remove('nav-exit');

            links.forEach(link => {
                link.style.pointerEvents = '';
            });

            isExiting = false;
            
            // 不再重置入场动画，避免闪烁
        }

        function initNav() {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.onclick = (e) => {
                    e.preventDefault();
                    pageExitAnimation(link.getAttribute('href'));
                };
            });
        }

        window.addEventListener('pageshow', () => {
            resetPageState();
            initNav();
        });

        window.onload = () => {
            initTheme();
            initNav();
            resetPageState();
        };
    </script>
    <script>
        // 深色模式下添加随机星星
        function addStars() {
            // 只添加一次
            if (document.querySelector('.star')) return;
            const body = document.body;
            const starCount = 120; // 星星数量
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                // 随机大小 1px ~ 3px
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                // 随机位置 (百分比)
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                // 随机闪烁延迟
                star.style.animationDelay = Math.random() * 5 + 's';
                // 随机透明度
                star.style.opacity = Math.random() * 0.6 + 0.2;
                body.appendChild(star);
            }
        }

        // 监听深色模式变化（如果初始就是深色，直接添加）
        if (document.body.classList.contains('dark')) {
            addStars();
        }
        // 监听深色模式切换
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'class') {
                    if (document.body.classList.contains('dark')) {
                        addStars();
                    } else {
                        // 浅色模式时移除星星
                        document.querySelectorAll('.star').forEach(star => star.remove());
                    }
                }
            });
        });
        observer.observe(document.body, { attributes: true });
    </script>
</body>
</html>
