<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小箱子</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { light: '#A855F7', DEFAULT: '#9333EA', dark: '#7C3AED' },
                        secondary: { light: '#C084FC', DEFAULT: '#A855F7', dark: '#9333EA' }
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient { background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
            .hover-lift { transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
            .hover-lift:hover {
                transform: translateY(-5px) scale(1.05);
                box-shadow: 0 16px 20px -5px rgba(0,0,0,0.08), 0 8px 8px -5px rgba(0,0,0,0.032);
                background: #fff;
                border-color: rgba(168,85,247,0.15);
            }
            .dark .hover-lift:hover {
                box-shadow: 0 16px 30px -5px rgba(168,85,247,0.3), 0 8px 15px -5px rgba(168,85,247,0.2);
                background: rgba(30,30,40,0.8);
                border-color: rgba(168,85,247,0.35);
            }
        }

        body {
            overflow-x: hidden;
            background: linear-gradient(to top, rgba(168,85,247,0.15), #fff 70%);
            transition: background 0.4s ease;
            position: relative;
        }

        body.dark {
            background: #0f0f17;
        }
        body.dark::before {
            content: '';
            position: fixed; inset: 0;
            pointer-events: none; z-index: -1;
            box-shadow: inset 0 0 180px 45px rgba(168,85,247,0.28);
            animation: borderBreath 3.2s ease-in-out infinite alternate;
        }

        @keyframes borderBreath {
            from { box-shadow: inset 0 0 140px 35px rgba(168,85,247,0.22); }
            to   { box-shadow: inset 0 0 220px 60px rgba(168,85,247,0.35); }
        }

        /* 退场背景覆盖：浅色模式用白色，深色模式用黑色 */
        body.exit-bg {
            transition: background 0s; /* 立即生效，无过渡 */
        }
        body.exit-bg:not(.dark) {
            background: white !important;
        }
        body.exit-bg.dark {
            background: #000000 !important; /* 纯黑，或 #0a0a0f 也可 */
        }
        body.exit-bg::before {
            display: none !important; /* 移除深色模式的光晕特效 */
        }

        @keyframes dropDown {
            from { opacity: 0; transform: translateY(-140px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-drop {
            animation: dropDown 1s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease forwards; opacity: 0; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }

        .nav-option {
            padding: 1rem 2.5rem; font-size: 1.5rem; font-weight: 500; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
            background: transparent; border-radius: 12px;
            border: 1px solid rgba(168,85,247,0.1);
            color: #374151;
        }
        .dark .nav-option {
            border-color: rgba(168,85,247,0.25);
            color: #e5e7eb;
        }

        .theme-toggle {
            position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
            width: 44px; height: 44px; border-radius: 12px;
            border: 1px solid rgba(168,85,247,0.15);
            background: transparent;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: #6b7280;
            transition: all 0.35s ease; z-index: 999;
        }
        .theme-toggle:hover {
            transform: translateX(-50%) translateY(-2px);
            background: #fff; border-color: rgba(168,85,247,0.2);
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        }
        .dark .theme-toggle {
            border-color: rgba(168,85,247,0.3);
            color: #d1d5db;
        }
        .dark .theme-toggle:hover {
            background: rgba(32,32,46,0.8);
            box-shadow: 0 8px 22px rgba(168,85,247,0.22);
        }

        .title-gradient {
            background: linear-gradient(90deg, #A855F7, #EC4899);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .dark .title-gradient {
            background: linear-gradient(90deg, #C084FC, #F472B6);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page-exit { animation: pageExit 0.8s cubic-bezier(0.25,0.46,0.45,0.94) forwards; }
        .nav-exit { animation: navExit 0.6s ease forwards; }
        @keyframes pageExit { to { opacity: 0; } }
        @keyframes navExit { to { opacity: 0; transform: translateY(30px) scale(0.95); } }
                /* 星星样式 */
        .star {
            position: fixed;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            animation: twinkle 3s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
                /* 深色模式下小球更明显（白色带发光） */
        .dark #cursor-dot {
            background-color: rgba(255, 255, 255, 0.6) !important;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
        }
                /* 原有的 fadeInUp 动画等 ... */
        .delay-300 { animation-delay: 0.3s; }

        /* ===== 新增海报样式 ===== */
        @keyframes posterFadeDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-poster-fade-down {
            animation: posterFadeDown 0.8s ease-out forwards;
        }
        .poster-img {
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }
        .poster-img:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.25);
        }
        .dark .poster-img {
            box-shadow: 0 0 0 1px rgba(168,85,247,0.2), 0 8px 20px rgba(0,0,0,0.3);
        }
        .dark .poster-img:hover {
            box-shadow: 0 0 20px rgba(168,85,247,0.5), 0 8px 25px -8px rgba(0,0,0,0.4);
        }
        /* 海报入场动画 */
        @keyframes posterFadeDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-poster-fade-down {
            animation: posterFadeDown 0.8s ease-out forwards;
        }

        /* 浅色模式 */
        .poster-img {
            border-radius: 0.75rem;
            transition: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }
        .poster-img:hover {
            transform: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* 深色模式：底部光晕 + 细小描边 */
        .dark .poster-img {
            box-shadow: 0 16px 30px -5px rgba(168, 85, 247, 0.3), 0 8px 15px -5px rgba(168, 85, 247, 0.2);
            border: 3px solid rgba(168, 85, 247, 0.40);
        }
        .dark .poster-img:hover {
            transform: none;
            box-shadow: 0 16px 30px -5px rgba(168, 85, 247, 0.3), 0 8px 15px -5px rgba(168, 85, 247, 0.2);
            border: 3px solid rgb(187, 115, 255,0.5);
        }
    </style>
</head>

<body class="font-sans min-h-screen flex flex-col">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark');
            }
        })();
        
    </script>
    <button id="themeToggle" class="theme-toggle">
        <i class="fa fa-moon-o"></i>
    </button>
    <!-- 跟随鼠标的小圆点 -->
    <div id="cursor-dot" class="fixed w-6 h-6 rounded-full bg-primary/20 pointer-events-none z-[100] transition-all duration-200 ease-out" style="transform: translate(-50%, -50%); left: 0; top: 0; opacity: 0;"></div>
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12">
        <!-- 海报容器，带入场动画 -->
        <div class="flex justify-center mb-8 animate-poster-fade-down">
            <a href="https://www.qijishow.com/adobeall/index.html" target="_blank" rel="noopener noreferrer">
                <img src="ps001.jpg" alt="海报" 
                    class="poster-img max-w-full w-auto h-auto rounded-xl"
                    style="max-height: 600px; object-fit: cover;">
            </a>
        </div>

        <!-- 标题 -->
        <h1 id="pageTitle" class="text-[clamp(2.5rem,8vw,5rem)] font-bold mb-16 text-center animate-drop">
            <span class="title-gradient">小箱子</span>
        </h1>

        <div id="navContainer" class="flex flex-col md:flex-row gap-8 md:gap-16">
            <a href="index1.html" class="nav-option animate-fade-in-up delay-200 hover-lift nav-link">
                <i class="fa fa-flask mr-2"></i>成分
            </a>
            <a href="tool.html" class="nav-option animate-fade-in-up delay-300 hover-lift nav-link">
                <i class="fa fa-wrench mr-2"></i>工具
            </a>
        </div>
    </main>

    <script>
        
        // 深色模式初始化
        function initTheme() {
            const btn = document.getElementById('themeToggle');
            const icon = btn.querySelector('i');
            const saved = localStorage.getItem('theme');

            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme:dark)').matches)) {
                document.body.classList.add('dark');
                icon.classList.replace('fa-moon-o', 'fa-sun-o');
            }

            btn.onclick = () => {
                const isDark = document.body.classList.toggle('dark');
                icon.classList.toggle('fa-moon-o', !isDark);
                icon.classList.toggle('fa-sun-o', isDark);
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            };
        }

        let isExiting = false;

        function pageExitAnimation(url) {
            if (isExiting) return;
            isExiting = true;

            const body = document.body;
            const title = document.getElementById('pageTitle');
            const nav = document.getElementById('navContainer');

            // 添加退场动画类（内容渐隐）
            body.classList.add('page-exit');
            title.classList.add('nav-exit');
            nav.classList.add('nav-exit');

            // 根据当前深色模式添加对应的背景覆盖类
            body.classList.add('exit-bg');

            // 禁用导航链接
            document.querySelectorAll('.nav-link').forEach(link => {
                link.style.pointerEvents = 'none';
            });

            setTimeout(() => {
                window.location.href = url;
            }, 800);
        }

        function resetPageState() {
            const body = document.body;
            const title = document.getElementById('pageTitle');
            const nav = document.getElementById('navContainer');
            const links = document.querySelectorAll('.nav-link');

            // 移除所有退场相关类
            body.classList.remove('page-exit', 'exit-bg');
            title.classList.remove('nav-exit');
            nav.classList.remove('nav-exit');

            links.forEach(link => {
                link.style.pointerEvents = '';
            });

            isExiting = false;
            
            // 不再重置入场动画，避免闪烁
        }

        function initNav() {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.onclick = (e) => {
                    e.preventDefault();
                    pageExitAnimation(link.getAttribute('href'));
                };
            });
        }

        window.addEventListener('pageshow', () => {
            resetPageState();
            initNav();
        });

        window.onload = () => {
            initTheme();
            initNav();
            resetPageState();
        };
                // 跟随鼠标的小圆点
        const cursorDot = document.getElementById('cursor-dot');
        let mouseX = 0, mouseY = 0;
        let dotX = 0, dotY = 0;
        let isMouseMoving = false;
        let timeoutId;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            if (cursorDot.style.opacity === '0') {
                cursorDot.style.opacity = '1';
            }
            isMouseMoving = true;
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                isMouseMoving = false;
            }, 100);
        });
        
        document.addEventListener('mouseleave', () => {
            cursorDot.style.opacity = '0';
        });
        document.addEventListener('mouseenter', () => {
            if (mouseX !== 0 || mouseY !== 0) {
                cursorDot.style.opacity = '1';
            }
        });

        function animateDot() {
            const diffX = mouseX - dotX;
            const diffY = mouseY - dotY;
            if (isMouseMoving) {
                dotX += diffX * 0.15;
                dotY += diffY * 0.15;
            } else {
                dotX += diffX * 0.1;
                dotY += diffY * 0.1;
            }
            cursorDot.style.left = dotX + 'px';
            cursorDot.style.top = dotY + 'px';
            requestAnimationFrame(animateDot);
        }
        animateDot();
        
    </script>
    <script>
        // 深色模式下添加随机星星
        function addStars() {
            // 只添加一次
            if (document.querySelector('.star')) return;
            const body = document.body;
            const starCount = 120; // 星星数量
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                // 随机大小 1px ~ 3px
                const size = Math.random() * 2 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                // 随机位置 (百分比)
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                // 随机闪烁延迟
                star.style.animationDelay = Math.random() * 5 + 's';
                // 随机透明度
                star.style.opacity = Math.random() * 0.6 + 0.2;
                body.appendChild(star);
            }
        }

        // 监听深色模式变化（如果初始就是深色，直接添加）
        if (document.body.classList.contains('dark')) {
            addStars();
        }
        // 监听深色模式切换
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'class') {
                    if (document.body.classList.contains('dark')) {
                        addStars();
                    } else {
                        // 浅色模式时移除星星
                        document.querySelectorAll('.star').forEach(star => star.remove());
                    }
                }
            });
        });
        observer.observe(document.body, { attributes: true });
        
    </script>
    <!-- 左下角悬浮控件：竖线 → 眼睛小球 + 快捷键提示（控制现有小球） -->
    <style>
    /* 控件样式 */
    .cursor-toggle-widget {
        position: fixed;
        bottom: 30px;
        left: 0;
        z-index: 10000;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
    }

    .widget-line {
        width: 4px;
        height: 40px;
        background-color: #cbd5e1;
        border-radius: 2px;
        transition: height 0.25s cubic-bezier(0.34, 1.2, 0.64, 1);
        margin-left: 12px;
    }
    .dark .widget-line {
        background-color: #4b5563;
    }

    .widget-eye {
        width: 0px;
        height: 0px;
        background-color: #9333ea;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0px;
        color: white;
        transition: all 0.2s cubic-bezier(0.34, 1.2, 0.64, 1);
        overflow: hidden;
        transform: scale(0);
        opacity: 0;
    }
    @keyframes bounceIn {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }
    .cursor-toggle-widget:hover .widget-line {
        height: 16px;
    }
    .cursor-toggle-widget:hover .widget-eye {
        width: 36px;
        height: 36px;
        font-size: 20px;
        transform: scale(1);
        opacity: 1;
        animation: bounceIn 0.3s ease-out forwards;
    }
    .widget-hint {
        font-size: 13px;
        color: #6b7280;
        background: transparent;
        padding: 4px 8px;
        border-radius: 20px;
        white-space: nowrap;
        opacity: 0;
        transform: translateX(-8px);
        transition: opacity 0.2s ease 0.1s, transform 0.2s ease 0.1s;
        pointer-events: none;
    }
    .dark .widget-hint {
        color: #9ca3af;
    }
    .cursor-toggle-widget:hover .widget-hint {
        opacity: 0.8;
        transform: translateX(0);
    }
    </style>

    <div class="cursor-toggle-widget" id="cursorToggleWidget">
    <div class="widget-line"></div>
    <div class="widget-eye">
        <i class="fa fa-eye"></i>
    </div>
    <div class="widget-hint">Ctrl+H ｜ 隐藏小球</div>
    </div>

    <script>
    (function() {
        // 获取页面中已存在的跟随鼠标小球元素（ID 为 "cursor-dot"）
        const cursorDot = document.getElementById('cursor-dot');
        if (!cursorDot) {
        console.warn('未找到 id="cursor-dot" 的小球，控件无效');
        return;
        }

        // 读取存储的显示状态
        let dotVisible = true;
        const savedState = localStorage.getItem('cursorDotVisible');
        if (savedState !== null && savedState === 'false') {
        dotVisible = false;
        cursorDot.style.display = 'none';
        } else {
        cursorDot.style.display = '';
        }

        // 切换小球的显示/隐藏
        function setDotVisible(visible) {
        dotVisible = visible;
        cursorDot.style.display = visible ? '' : 'none';
        localStorage.setItem('cursorDotVisible', visible);
        }

        // 控件点击事件
        const widget = document.getElementById('cursorToggleWidget');
        if (widget) {
        widget.addEventListener('click', (e) => {
            e.stopPropagation();
            setDotVisible(!dotVisible);
            // 简单的视觉反馈：让眼睛图标轻微缩放
            const eyeIcon = widget.querySelector('.widget-eye i');
            if (eyeIcon) {
            eyeIcon.style.transform = 'scale(0.9)';
            setTimeout(() => { eyeIcon.style.transform = ''; }, 150);
            }
        });
        }

        // 快捷键 Ctrl+H 切换
        document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && (e.key === 'h' || e.key === 'H')) {
            e.preventDefault();
            setDotVisible(!dotVisible);
            if (widget) {
            const eyeIcon = widget.querySelector('.widget-eye i');
            if (eyeIcon) {
                eyeIcon.style.transform = 'scale(0.9)';
                setTimeout(() => { eyeIcon.style.transform = ''; }, 150);
            }
            }
        }
        });
    })();
    
    </script>
</body>
</html>
