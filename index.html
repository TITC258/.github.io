        // 合并重复成分，生成新数据（修复版）
        function mergeIngredientsData(originalData) {
            // 定义部位类到大类的映射规则
            function getNormalizedCategory(item) {
                const originalCat = item.category;
                if (originalCat === "眼部护理专属类") {
                    // 根据名称和功效判断：如果含抗老关键词则归入紧致抗老类，否则归入基础保湿类
                    const text = (item.name + (item.benefits || '')).toLowerCase();
                    const antiAgingKeywords = ['a醇', '视黄醇', '玻色因', '胜肽', '六胜肽', '类蛇毒肽', '芋螺肽', '蓝铜胜肽', '抗老', '紧致', '提拉', '细纹', '皱纹'];
                    if (antiAgingKeywords.some(kw => text.includes(kw))) {
                        return "紧致抗老提拉类";
                    } else {
                        return "基础保湿锁水类";
                    }
                }
                if (originalCat === "手足护理专属类") {
                    // 手足护理通常以保湿修护为主，归入基础保湿锁水类
                    return "基础保湿锁水类";
                }
                // 其他大类保持不变
                return originalCat;
            }

            const map = new Map(); // key: 成分名称

            originalData.forEach(item => {
                // 标准化大类
                const normalizedCategory = getNormalizedCategory(item);
                
                // 创建新对象
                const normalizedItem = {
                    ...item,
                    category: normalizedCategory
                };

                // 从 products 提取子类
                const subcategories = new Set();
                const productsText = normalizedItem.products || '';
                for (const [sub, keywords] of Object.entries(subcategoryKeywords)) {
                    for (const kw of keywords) {
                        if (productsText.includes(kw)) {
                            subcategories.add(sub);
                            break;
                        }
                    }
                }
                // 原眼部类强制添加“眼霜”
                if (item.category === "眼部护理专属类") {
                    subcategories.add("眼霜");
                }
                // 原手足类强制添加手霜/足霜
                if (item.category === "手足护理专属类") {
                    if (productsText.includes('手') || productsText.includes('手足')) subcategories.add("手霜");
                    if (productsText.includes('足') || productsText.includes('手足')) subcategories.add("足霜");
                    // 如果都没匹配到，至少添加一个“手霜”作为代表
                    if (!subcategories.has("手霜") && !subcategories.has("足霜")) {
                        subcategories.add("手霜");
                    }
                }
                normalizedItem.subcategories = Array.from(subcategories);

                const name = normalizedItem.name;
                if (map.has(name)) {
                    // 已存在，合并 products 和子类
                    const existing = map.get(name);
                    // 合并 products
                    const productsSet = new Set([existing.products, normalizedItem.products]);
                    existing.products = Array.from(productsSet).join('，');
                    // 合并子类
                    const mergedSubs = new Set([...existing.subcategories, ...normalizedItem.subcategories]);
                    existing.subcategories = Array.from(mergedSubs);
                    // 其他字段保持原有（category 应已统一）
                } else {
                    // 不存在，直接添加
                    map.set(name, normalizedItem);
                }
            });

            return Array.from(map.values());

        // 按子类分组渲染（用于大类页面）
        function renderCategoryPage(ingredients, categoryName) {
            ingredientsContainer.innerHTML = '';
            ingredientsContainer.className = 'flex flex-col gap-6';
            
            const quickNav = document.getElementById('quick-nav');
            if (quickNav) quickNav.innerHTML = '';

            if (ingredients.length === 0) {
                ingredientsContainer.innerHTML = `
                    <div class="text-center py-12 w-full">
                        <i class="fa fa-search text-4xl text-gray-400 mb-4"></i>
                        <p class="text-lg text-gray-500">未找到匹配的成分，请尝试其他搜索词或进行反馈</p>
                    </div>
                `;
                return;
            }

            // 收集所有子类
            const allSubs = new Set();
            ingredients.forEach(ing => {
                ing.subcategories.forEach(sub => allSubs.add(sub));
            });

            // 自定义排序优先级
            const prioritySubs = ['面霜', '颈霜', '眼霜', '精华', '手霜', '足霜'];
            const subsArray = Array.from(allSubs);
            const sortedSubs = subsArray.sort((a, b) => {
                const aIndex = prioritySubs.indexOf(a);
                const bIndex = prioritySubs.indexOf(b);
                if (aIndex !== -1 && bIndex !== -1) {
                    return aIndex - bIndex;
                }
                if (aIndex !== -1) return -1;
                if (bIndex !== -1) return 1;
                return a.localeCompare(b);
            });

            // 为每个子类创建一个区块
            sortedSubs.forEach(sub => {
                const subIngredients = ingredients.filter(ing => ing.subcategories.includes(sub));
                if (subIngredients.length === 0) return;

                // 子类标题
                const section = document.createElement('div');
                section.id = `sub-${sub.replace(/\s+/g, '-')}`;
                section.className = 'mb-10';
                section.innerHTML = `<h3 class="text-xl font-semibold text-gray-800 mb-4 pb-2 border-b border-gray-200">${sub}</h3>`;
                
                // 生成胶囊按钮
                const capsule = document.createElement('button');
                capsule.className = 'capsule-btn';
                capsule.textContent = sub;
                capsule.setAttribute('data-target', `sub-${sub.replace(/\s+/g, '-')}`);
                capsule.addEventListener('click', () => {
                    const target = document.getElementById(`sub-${sub.replace(/\s+/g, '-')}`);
                    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                if (quickNav) quickNav.appendChild(capsule);

                // 根据屏幕宽度确定列数（与 renderIngredients 一致）
                const columnCount = window.innerWidth < 640 ? 1 : (window.innerWidth < 1024 ? 2 : 3);

                // 创建列容器数组
                const columns = [];
                for (let i = 0; i < columnCount; i++) {
                    const col = document.createElement('div');
                    col.className = 'flex-1 flex flex-col gap-6';
                    columns.push(col);
                }

                // 将卡片按顺序分配到各列
                subIngredients.forEach((ing, index) => {
                    const colIndex = index % columnCount;
                    const card = createCard(ing);
                    columns[colIndex].appendChild(card);
                });

                // 将列容器放入一个 flex 行容器中，再添加到 section
                const rowContainer = document.createElement('div');
                rowContainer.className = 'flex flex-col sm:flex-row gap-6 items-start';
                columns.forEach(col => rowContainer.appendChild(col));

                section.appendChild(rowContainer);
                ingredientsContainer.appendChild(section);
            });
            
            // 添加返回顶部胶囊
            if (quickNav) {
                appendBackToTopCapsule();
            }
        }

        // 渲染违规词对照页面（改进版，左右对齐）
        function renderProhibitedWords(data) {

        // 过滤违规词数据
        function filterProhibitedWords(data, searchTerm) {
            if (!searchTerm) return data; // 无搜索词时返回原数据

            const lowerTerm = searchTerm.toLowerCase();
            const filtered = [];

            data.forEach(category => {
                const filteredItems = category.items.filter(item => 
                    item.en.toLowerCase().includes(lowerTerm) || 
                    item.zh.includes(lowerTerm) // 中文直接包含即可
                );
                if (filteredItems.length > 0) {
                    filtered.push({
                        category: category.category,
                        items: filteredItems
                    });
                }
            });

            return filtered;
        }

        // 筛选成分
        function filterIngredients() {
            // 违规词参考分类保持不变
            if (currentCategory === '违规词参考') {
                let filteredData = prohibitedWordsDetailed;
                if (currentSearchTerm) {
                    filteredData = filterProhibitedWords(prohibitedWordsDetailed, currentSearchTerm);
                }
                renderProhibitedWords(filteredData);
                return;
            }
            
            // 使用合并后的数据
            let filtered = mergedIngredientsData;
            
            // 如果不是“全部”，按大类筛选
            if (currentCategory !== 'all') {
                filtered = filtered.filter(ingredient => ingredient.category === currentCategory);
            }
            
            // 按搜索词筛选（支持名称、英文名、学名）
            if (currentSearchTerm) {
                const searchLower = currentSearchTerm.toLowerCase();
                filtered = filtered.filter(ingredient => 
                    ingredient.name.toLowerCase().includes(searchLower) || 
                    (ingredient.englishName && ingredient.englishName.toLowerCase().includes(searchLower)) || 
                    (ingredient.scientificName && ingredient.scientificName.toLowerCase().includes(searchLower))
                );
            }
            
            // 根据当前分类决定渲染方式
            if (currentCategory === 'all') {
                // 全部成分页面：使用多列布局，卡片带子类标签
                renderIngredients(filtered);
            } else {
                // 大类页面：按子类分组渲染
                renderCategoryPage(filtered, currentCategory);
            }
        }

                // 添加延迟，等搜索框完全收回收起后再显示放大镜按钮
                setTimeout(() => {
                    searchButton.classList.remove('hidden'); // 显示放大镜按钮
                }, 300); // 延迟时间与 CSS transition 时间一致
            }
        }

        // 自定义搜索按钮点击事件
        searchButton.addEventListener('click', function(e) {
            e.preventDefault();
            if (!isSearchExpanded()) {
                expandSearch();
            } else {
                // 已展开则执行搜索
                handleSearch();
            }
        });

        // 输入框失去焦点时尝试收起
        searchInput.addEventListener('blur', function() {
            collapseSearch();
        });

        // 实时搜索：输入内容变化立即筛选
        searchInput.addEventListener('input', function() {
            currentSearchTerm = searchInput.value.trim();
            filterIngredients();
        });

        // 窗口大小变化时调整展开宽度
        window.addEventListener('resize', function() {
            if (isSearchExpanded()) {
                if (window.innerWidth < 768) {
                    searchInput.classList.remove('w-64');
                    searchInput.classList.add('w-full');
                } else {
                    searchInput.classList.remove('w-full');
                    searchInput.classList.add('w-64');
                }
            }
        });
        // ========== 结束 ==========

        // 事件监听
        // searchButton.addEventListener('click', handleSearch); // 注释掉原有事件，使用新的展开/收起逻辑
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                handleCategoryFilter(btn.dataset.category);
            });
        });

        // 窗口大小变化时重新渲染（防抖处理）
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                filterIngredients(); // 重新触发筛选，自动重新布局
            }, 200);
        });

        // 返回顶部按钮功能
        const backToTop = document.getElementById('back-to-top');

        // 监听滚动事件，显示/隐藏按钮
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) { // 滚动超过300px时显示
                backToTop.classList.remove('opacity-0', 'invisible');
                backToTop.classList.add('opacity-100', 'visible');
            } else {
                backToTop.classList.add('opacity-0', 'invisible');
                backToTop.classList.remove('opacity-100', 'visible');
            }
        });

        // 点击按钮平滑滚动到顶部
        backToTop.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // 跟随鼠标的小圆点
        const cursorDot = document.getElementById('cursor-dot');
        let mouseX = 0, mouseY = 0;
        let dotX = 0, dotY = 0;
        let isMouseMoving = false;
        let timeoutId;

        // 监听鼠标移动
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // 显示圆点
            if (cursorDot.style.opacity === '0') {
                cursorDot.style.opacity = '1';
            }
            
            // 标记鼠标正在移动，清除之前的定时器
            isMouseMoving = true;
            clearTimeout(timeoutId);
            
            // 设置定时器，当鼠标停止移动 100ms 后标记停止
            timeoutId = setTimeout(() => {
                isMouseMoving = false;
            }, 100);
        });

        // 鼠标离开页面时隐藏圆点
        document.addEventListener('mouseleave', () => {
            cursorDot.style.opacity = '0';
        });

        // 鼠标进入页面时显示圆点（如果之前隐藏了）
        document.addEventListener('mouseenter', () => {
            if (mouseX !== 0 || mouseY !== 0) {
                cursorDot.style.opacity = '1';
            }
        });

        // 动画循环：让圆点平滑跟随
        function animateDot() {
            // 计算与目标位置的差值
            const diffX = mouseX - dotX;
            const diffY = mouseY - dotY;
            
            // 根据鼠标是否移动调整跟随速度
            if (isMouseMoving) {
                // 移动时：快速跟随（但保留一点延迟感）
                dotX += diffX * 0.15;
                dotY += diffY * 0.15;
            } else {
                // 停止时：缓慢回到指针位置
                dotX += diffX * 0.1;
                dotY += diffY * 0.1;
            }
            
            // 应用位置
            cursorDot.style.left = dotX + 'px';
            cursorDot.style.top = dotY + 'px';
            
            requestAnimationFrame(animateDot);
        }

        // 启动动画循环
        animateDot();

        // 初始化页面
        // 初始化页面
        renderIngredients(mergedIngredientsData);
    </script>

</body></html>
