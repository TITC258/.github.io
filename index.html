<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小箱子 - 首页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            light: '#A855F7',
                            DEFAULT: '#9333EA',
                            dark: '#7C3AED'
                        },
                        secondary: {
                            light: '#C084FC',
                            DEFAULT: '#A855F7',
                            dark: '#9333EA'
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans SC', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .text-gradient {
                background-clip: text;
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
            .hover-lift {
                transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }
            .hover-lift:hover {
                transform: translateY(-5px) scale(1.05);
                box-shadow: 0 16px 20px -5px rgba(0, 0, 0, 0.08), 0 8px 8px -5px rgba(0, 0, 0, 0.032);
                background-color: #ffffff;
                border-color: rgba(168, 85, 247, 0.15);
            }
            .dark .hover-lift:hover {
                box-shadow: 0 16px 30px -5px rgba(168, 85, 247, 0.22), 0 8px 15px -5px rgba(168, 85, 247, 0.12);
                background-color: rgba(30, 30, 40, 0.8);
                border-color: rgba(168, 85, 247, 0.3);
            }
            .page-exit {
                animation: pageExit 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            }
            .nav-exit {
                animation: navExit 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            }
        }

        /* 浅色上下渐变背景 */
        body {
            overflow-x: hidden;
            background: linear-gradient(to bottom, rgba(168, 85, 247, 0.15), #ffffff 70%);
            transition: background 0.4s ease;
            position: relative;
        }

        /* 深色模式：边缘环绕呼吸光，纯色底色 */
        body.dark {
            background: #0f0f17;
        }
        body.dark::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            box-shadow: inset 0 0 120px 25px rgba(168, 85, 247, 0.18);
            animation: borderBreath 3.5s ease-in-out infinite alternate;
            z-index: -1;
        }
        @keyframes borderBreath {
            from {box-shadow: inset 0 0 100px 18px rgba(168, 85, 247, 0.12);}
            to {box-shadow: inset 0 0 160px 32px rgba(168, 85, 247, 0.24);}
        }

        /* 标题：匀速下落无回弹 */
        @keyframes dropDown {
            from {opacity:0;transform: translateY(-140px);}
            to {opacity:1;transform: translateY(0);}
        }
        .animate-drop {
            animation: dropDown 1s ease-out forwards;
        }
        @keyframes fadeInUp {
            from {opacity:0;transform: translateY(30px);}
            to {opacity:1;transform: translateY(0);}
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.8s ease forwards;
        }
        .delay-200{animation-delay:0.2s;opacity:0;}
        .delay-300{animation-delay:0.3s;opacity:0;}

        /* 导航按钮 */
        .nav-option {
            padding:1rem 2.5rem;
            font-size:1.5rem;
            font-weight:500;
            cursor:pointer;
            transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
            background:transparent;
            border-radius:12px;
            border:1px solid rgba(168,85,247,0.1);
            color:#374151;
        }
        .dark .nav-option {
            border-color:rgba(168,85,247,0.2);
            color:#d1d5db;
        }

        /* 顶部居中切换按钮 */
        .theme-toggle {
            position:fixed;
            top:24px;
            left:50%;
            transform:translateX(-50%);
            width:46px;height:46px;
            border-radius:12px;
            border:1px solid rgba(168,85,247,0.12);
            background:transparent;
            display:flex;align-items:center;justify-content:center;
            font-size:1.2rem;color:#6b7280;
            transition:all 0.35s ease;
            z-index:999;
        }
        .theme-toggle:hover {
            transform:translateX(-50%) translateY(-3px);
            background:#fff;
            border-color:rgba(168,85,247,0.18);
            box-shadow:0 8px 18px rgba(0,0,0,0.07);
        }
        .dark .theme-toggle {
            border-color:rgba(168,85,247,0.25);
            color:#c2c7d0;
        }
        .dark .theme-toggle:hover {
            background:rgba(32,32,45,0.75);
            box-shadow:0 8px 20px rgba(168,85,247,0.16);
        }

        .title-gradient {
            background:linear-gradient(90deg,#A855F7,#EC4899);
            background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
        }
        .dark .title-gradient {
            background:linear-gradient(90deg,#C084FC,#F472B6);
            background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
        }

        @keyframes pageExit {
            to {opacity:0;background:#fafafa;}
        }
        .dark .page-exit {
            to {opacity:0;background:#0a0a0f;}
        }
        @keyframes navExit {
            to {opacity:0;transform:translateY(30px) scale(0.95);}
        }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col">
    <button id="themeToggle" class="theme-toggle">
        <i class="fa fa-moon-o"></i>
    </button>

    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12">
        <h1 id="pageTitle" class="text-[clamp(2.5rem,8vw,5rem)] font-bold mb-16 text-center animate-drop">
            <span class="title-gradient">小箱子</span>
        </h1>
        <div id="navContainer" class="flex flex-col md:flex-row items-center justify-center gap-8 md:gap-16">
            <a href="index1.html" class="nav-option animate-fade-in-up delay-200 hover-lift nav-link">
                <i class="fa fa-flask mr-2"></i>成分
            </a>
            <a href="tool.html" class="nav-option animate-fade-in-up delay-300 hover-lift nav-link">
                <i class="fa fa-wrench mr-2"></i>工具
            </a>
        </div>
    </main>

    <script>
        // 主题切换
        function initThemeToggle(){
            const btn=document.getElementById('themeToggle');
            const icon=btn.querySelector('i');
            const save=localStorage.getItem('theme');
            if(save==='dark'||(!save&&window.matchMedia('(prefers-color-scheme:dark)').matches)){
                document.body.classList.add('dark');
                icon.classList.replace('fa-moon-o','fa-sun-o');
            }
            btn.onclick=()=>{
                const isDark=document.body.classList.toggle('dark');
                if(isDark){
                    icon.classList.replace('fa-moon-o','fa-sun-o');
                    localStorage.setItem('theme','dark');
                }else{
                    icon.classList.replace('fa-sun-o','fa-moon-o');
                    localStorage.setItem('theme','light');
                }
            }
        }

        // 页面退场跳转
        function pageExitAnimation(url){
            document.body.classList.add('page-exit');
            document.getElementById('pageTitle').style.animation='navExit 0.6s forwards';
            document.getElementById('navContainer').classList.add('nav-exit');
            setTimeout(()=>location.href=url,800);
        }

        // 导航点击
        function initNav(){
            const links=document.querySelectorAll('.nav-link');
            links.forEach(item=>{
                item.onclick=e=>{
                    e.preventDefault();
                    const url=item.getAttribute('href');
                    links.forEach(l=>l.style.pointerEvents='none');
                    pageExitAnimation(url);
                }
            })
        }

        window.onload=()=>{
            initThemeToggle();
            initNav();
        }
    </script>
</body>
</html>
