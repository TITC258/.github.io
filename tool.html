<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具 - 施工中</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { light: '#A855F7', DEFAULT: '#9333EA', dark: '#7C3AED' },
                        secondary: { light: '#C084FC', DEFAULT: '#A855F7', dark: '#9333EA' }
                    },
                    fontFamily: { sans: ['Noto Sans SC', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body {
            background: #ffffff;
            transition: background-color 0.3s ease;
        }
        body.dark {
            background: #0f0f17;
        }

        /* 返回主页按钮 */
        .back-home-btn {
            position: fixed;
            top: 22px;
            left: 22px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #4b5563;
            transition: all 0.35s ease;
            z-index: 9999;
            cursor: pointer;
            text-decoration: none;
        }
        .back-home-btn:hover {
            transform: translateY(-2px);
            background: #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            color: #4F46E5;
        }
        .dark .back-home-btn {
            background: rgba(32,32,46,0.8);
            color: #d1d5db;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .dark .back-home-btn:hover {
            background: rgba(45,45,60,0.9);
            color: #a855f7;
            box-shadow: 0 8px 22px rgba(168,85,247,0.2);
        }

        /* 深色模式切换按钮 */
        .theme-toggle {
            position: fixed;
            top: 22px;
            right: 22px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid rgba(168,85,247,0.15);
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #4b5563;
            transition: all 0.35s ease;
            z-index: 9999;
            cursor: pointer;
        }
        .theme-toggle:hover {
            transform: translateY(-2px);
            background: #fff;
            border-color: rgba(168,85,247,0.3);
            box-shadow: 0 8px 16px rgba(0,0,0,0.08);
        }
        .dark .theme-toggle {
            background: rgba(32,32,46,0.8);
            border-color: rgba(168,85,247,0.3);
            color: #d1d5db;
        }
        .dark .theme-toggle:hover {
            background: rgba(45,45,60,0.9);
            box-shadow: 0 8px 22px rgba(168,85,247,0.22);
        }

        /* 施工中内容样式 */
        .construction-content {
            text-align: center;
            animation: fadeInUp 0.8s ease-out forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .tool-icon {
            font-size: 5rem;
            color: #cbd5e1;
            margin-bottom: 1.5rem;
        }
        .dark .tool-icon {
            color: #4b5563;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #A855F7, #EC4899);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .dark h1 {
            background: linear-gradient(135deg, #C084FC, #F472B6);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            color: #4b5563;
        }
        .dark p {
            color: #9ca3af;
        }
        .btn-preview {
            margin-top: 2rem;
            display: inline-block;
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            background: linear-gradient(135deg, #A855F7, #EC4899);
            color: white;
            font-weight: 500;
            transition: all 0.3s;
            text-decoration: none;
            box-shadow: 0 8px 14px rgba(168,85,247,0.2);
        }
        .btn-preview:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(168,85,247,0.3);
        }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col">
    <!-- 返回主页按钮 -->
    <a href="index.html" id="backHomeBtn" class="back-home-btn">
        <i class="fa fa-home"></i>
    </a>
    <!-- 深色模式切换按钮 -->
    <button id="themeToggle" class="theme-toggle">
        <i class="fa fa-moon-o"></i>
    </button>

    <main class="flex-grow flex items-center justify-center px-4">
        <div class="construction-content">
            <div class="tool-icon">
                <i class="fa fa-wrench"></i>
            </div>
            <h1>🚧 施工中</h1>
            <p>工具页面正在加紧建设中，建好再来吧！</p>
            <a href="index.html" class="btn-preview">
                <i class="fa fa-arrow-left mr-2"></i>返回首页
            </a>
        </div>
    </main>

    <script>
        // 深色模式初始化与切换（与主页同步）
        function initTheme() {
            const btn = document.getElementById('themeToggle');
            if (!btn) return;
            const icon = btn.querySelector('i');
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme:dark)').matches)) {
                document.body.classList.add('dark');
                icon.classList.replace('fa-moon-o', 'fa-sun-o');
            }
            btn.onclick = () => {
                const isDark = document.body.classList.toggle('dark');
                icon.classList.toggle('fa-moon-o', !isDark);
                icon.classList.toggle('fa-sun-o', isDark);
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            };
        }

        // 返回按钮的退场动画（可选，保持与主页一致）
        let isExiting = false;
        function pageExitAndGoHome(url) {
            if (isExiting) return;
            isExiting = true;
            document.body.classList.add('page-exit');
            setTimeout(() => {
                window.location.href = url;
            }, 400);
        }

        // 绑定返回按钮（退场动画，但这里直接使用 href 也可以，为了优雅加动画）
        const backBtn = document.getElementById('backHomeBtn');
        if (backBtn) {
            backBtn.addEventListener('click', (e) => {
                e.preventDefault();
                pageExitAndGoHome('index.html');
            });
        }

        // 页面加载
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            document.body.classList.remove('page-exit');
            isExiting = false;
        });
        window.addEventListener('pageshow', () => {
            document.body.classList.remove('page-exit');
            isExiting = false;
        });

        // 简单退场动画样式
        const style = document.createElement('style');
        style.textContent = `
            body.page-exit {
                animation: pageExit 0.4s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
            }
            @keyframes pageExit {
                to { opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
